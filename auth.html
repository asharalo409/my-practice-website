<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up</title>
</head>

<body>

  <h1>Create Account</h1>

  <form id="signupForm">

    <input type="text" id="name" placeholder="Your name" required>

    <input type="email" id="email" placeholder="Your email" required>

    <input type="password" id="password" placeholder="Password" required>

    <input type="text" id="mobile" placeholder="Mobile number">

    <input type="text" id="department" placeholder="Department">

    <input type="text" id="roll" placeholder="Roll number">

    <button type="submit">Sign Up</button>

  </form>

  <hr>

  <h2>Login</h2>

  <form id="loginForm">

    <input type="email" id="loginEmail" placeholder="Your email" required>

    <input type="password" id="loginPassword" placeholder="Password" required>

    <button type="submit">Login</button>

  </form>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://eltvmtzvpmrmtebbfmaq.supabase.co";

    const SUPABASE_KEY = "sb_publishable_ab4lyf4pp-_ha0-KD29WZQ_aE4dohbW";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");

    document.getElementById("signupForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const mobile = document.getElementById("mobile").value;
      const department = document.getElementById("department").value;
      const roll = document.getElementById("roll").value;

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (!data.user) {
        message.textContent = "Please check your email to confirm your account.";
        return;
      }

      const { error: profileError } = await supabaseClient
        .from("profiles")
        .insert({
          id: data.user.id,
          name: name,
          mobile: mobile,
          department: department,
          roll: roll
        });

      if (profileError) {
        message.textContent = profileError.message;
        return;
      }

      message.textContent = "Account created successfully!";
      this.reset();
    });


    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Login successful!";
    });
  </script>

</body>
</html>
